<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Celebration Icon Mark -->
  <g transform="translate(4, 4)">
    <defs>
      <linearGradient id="lumoraPlum" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#56334F" />
        <stop offset="100%" stop-color="#3D2037" />
      </linearGradient>
      <linearGradient id="lumoraGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E5CA9E" />
        <stop offset="50%" stop-color="#D6B887" />
        <stop offset="100%" stop-color="#B8945A" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>

    <!-- Outer Celebration Ring -->
    <circle cx="28" cy="28" r="26" stroke="url(#lumoraGold)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <circle cx="28" cy="28" r="22" fill="url(#lumoraPlum)" />

    <!-- Crown & Celebration Radiance -->
    <!-- Central Celebration Figure / Starburst -->
    <path d="M28 14 L30 20 L36 21 L31.5 25 L33 31 L28 27.5 L23 31 L24.5 25 L20 21 L26 20 Z" fill="url(#lumoraGold)" />
    
    <!-- Sparkles and Arch -->
    <circle cx="20" cy="16" r="1.5" fill="url(#lumoraGold)" />
    <circle cx="36" cy="16" r="1.5" fill="url(#lumoraGold)" />
    <circle cx="28" cy="9" r="1.8" fill="url(#lumoraGold)" filter="url(#glow)" />
    
    <!-- Elegant Ribbon Flourish -->
    <path d="M14 36 C 20 44, 36 44, 42 36 C 36 40, 20 40, 14 36 Z" fill="url(#lumoraGold)" />
    <circle cx="28" cy="42" r="1.5" fill="url(#lumoraGold)" />
  </g>

  <!-- Typography: LUMORA EVENTS -->
  <text x="68" y="32" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" letter-spacing="1.5" fill="currentColor">
    LUMORA
  </text>
  <text x="180" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="300" letter-spacing="3" fill="#D6B887">
    EVENTS
  </text>
  <text x="69" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.2" fill="#D6B887" text-transform="uppercase">
    Plan • Celebrate • Cherish
  </text>
</svg>
